# Local / development stack. Code is bind-mounted; env comes from `.env`
# (copy .env.example). Production: docker-compose.prod.yml — same services,
# baked image, identical env list for app / queue / scheduler.
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: msp-platform-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - msp

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - msp

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-msp}
      POSTGRES_USER: ${DB_USERNAME:-msp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-msp} -d ${DB_DATABASE:-msp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - msp

  # Runs Laravel's scheduler (for renewal/notice-period alerts) — one-minute ticks
  scheduler:
    image: msp-platform-app
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: >
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      - app
      - db
    networks:
      - msp

  # Processes queued jobs (mail notifications, etc.)
  queue:
    image: msp-platform-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      - app
      - db
    networks:
      - msp

networks:
  msp:
    driver: bridge

volumes:
  dbdata:
