    delete: { summary: Delete, responses: { '204': { description: No content } } }
  /purchase-bundles:
    get: { summary: List purchase bundles, responses: { '200': { description: OK } } }
    post: { summary: Create purchase bundle, responses: { '201': { description: Created } } }
  /purchase-bundles/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
    get: { summary: Show with allocation metrics, responses: { '200': { description: OK } } }
    put: { summary: Update, responses: { '200': { description: OK } } }
    patch: { summary: Patch, responses: { '200': { description: OK } } }
    delete: { summary: Delete, responses: { '204': { description: No content } } }
  /contracts/upcoming-renewals:
    get: { summary: Upcoming renewals, responses: { '200': { description: OK } } }
  /contracts:
    get: { summary: List contracts, responses: { '200': { description: OK } } }
    post: { summary: Create contract, responses: { '201': { description: Created } } }
  /contracts/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
    get: { summary: Show, responses: { '200': { description: OK } } }
    put: { summary: Update, responses: { '200': { description: OK } } }
    patch: { summary: Patch, responses: { '200': { description: OK } } }
    delete: { summary: Delete, responses: { '204': { description: No content } } }
  /tokens:
    get:
      summary: List own PATs
      description: Never returns plaintext.
      responses: { '200': { description: OK } }
    post:
      summary: Create own PAT
      description: plain_text_token returned once.
      responses: { '201': { description: Created } }
  /tokens/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
    delete:
      summary: Revoke own PAT
      responses: { '204': { description: No content } }
